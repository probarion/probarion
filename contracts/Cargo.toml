[workspace]
resolver = "2"
members = ["test-ft", "vault", "intents-stub"]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/probarion/probarion"

[workspace.dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
near-workspaces = "=0.23.0"
proptest = "1"
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

  <g font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="64" y="80" font-size="20" font-weight="600" letter-spacing="2.4" fill="#5E4210">SPEND 2, A MAINNET PAYOUT, 2026-11-13</text>
    <rect x="808" y="50" width="408" height="44" rx="22" fill="#FFF0C2" stroke="#A57A26"/>
    <text x="1012" y="79" font-size="21" font-weight="600" text-anchor="middle" fill="#0B0B0C">A test, not a customer payment</text>

    <text x="64" y="146" font-size="18" font-weight="600" letter-spacing="2" fill="#4E4B45">NEAR MAINNET</text>
    <text x="58" y="248" font-size="112" font-weight="300" letter-spacing="-4" fill="#0B0B0C">1.00</text>
    <text x="64" y="288" font-size="24" font-weight="600" fill="#4E4B45">USDC burned</text>

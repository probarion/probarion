<svg role="img" aria-labelledby="mp-title mp-desc" xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560"><title id="mp-title">The mainnet payout of spend 2, 2026-11-13: 1.00 USDC burned on NEAR mainnet, 0.9976 USDC arrived on Base</title><desc id="mp-desc">Spend 2, the earlier of the two Base payouts that day. A test, not a customer payment. The vault v0.probarion.near burned 1.00 USDC for spend 2 at 07:24 UTC, and 0.9976 USDC arrived in the owner's own Base wallet 0xB22E…6EB27 in block 56821514. Decided by the code rules alone, after code refused two attested model proposals. The seven checks, 01 to 07, passed 7 of 7. The POA bridge kept 0.0024 USDC as its fee.</desc><defs>
  <linearGradient id="mp-coin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A57A26"/><stop offset="0.28" stop-color="#EFCB6B"/><stop offset="0.42" stop-color="#FFF0C2"/><stop offset="0.56" stop-color="#D4A640"/><stop offset="0.8" stop-color="#A57A26"/><stop offset="1" stop-color="#5E4210"/></linearGradient>
  <radialGradient id="mp-coin-hi" cx="30%" cy="26%" r="50%"><stop offset="0" stop-color="#FFF0C2" stop-opacity="0.7"/><stop offset="1" stop-color="#FFF0C2" stop-opacity="0"/></radialGradient>
  <linearGradient id="mp-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A57A26"/><stop offset="0.35" stop-color="#EFCB6B"/><stop offset="0.5" stop-color="#FFF0C2"/><stop offset="0.7" stop-color="#D4A640"/><stop offset="1" stop-color="#A57A26"/></linearGradient>
</defs>
  <rect width="1280" height="560" fill="#F7F6F3"/>

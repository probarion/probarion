    <text x="1216" y="146" font-size="18" font-weight="600" letter-spacing="2" text-anchor="end" fill="#4E4B45">BASE</text>
    <text x="1220" y="248" font-size="112" font-weight="300" letter-spacing="-4" text-anchor="end" fill="#0B0B0C">0.9976</text>
    <text x="1216" y="288" font-size="24" font-weight="600" text-anchor="end" fill="#125935">USDC arrived</text>
    <text x="1216" y="320" font-size="20" text-anchor="end" fill="#4E4B45">The owner's own wallet 0xB22E…6EB27, block 56821514</text>


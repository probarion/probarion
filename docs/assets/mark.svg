<svg role="img" aria-label="Probarion mark" xmlns="http://www.w3.org/2000/svg" width="144" height="122" viewBox="0 0 144 122"><title>Probarion mark</title><defs>
  <linearGradient id="ml-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#A57A26"/><stop offset="0.28" stop-color="#EFCB6B"/><stop offset="0.42" stop-color="#FFF0C2"/><stop offset="0.56" stop-color="#D4A640"/><stop offset="0.8" stop-color="#A57A26"/><stop offset="1" stop-color="#5E4210"/></linearGradient>
  <radialGradient id="ml-hi" cx="24%" cy="20%" r="45%"><stop offset="0" stop-color="#FFF0C2" stop-opacity="0.75"/><stop offset="1" stop-color="#FFF0C2" stop-opacity="0"/></radialGradient>
  <radialGradient id="ml-warm" cx="86%" cy="82%" r="45%"><stop offset="0" stop-color="#EFCB6B" stop-opacity="0.55"/><stop offset="1" stop-color="#EFCB6B" stop-opacity="0"/></radialGradient>
  <radialGradient id="ml-deep" cx="55%" cy="112%" r="58%"><stop offset="0" stop-color="#5E4210" stop-opacity="0.9"/><stop offset="1" stop-color="#5E4210" stop-opacity="0"/></radialGradient>
  <linearGradient id="ml-bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A57A26"/><stop offset="0.35" stop-color="#EFCB6B"/><stop offset="0.5" stop-color="#FFF0C2"/><stop offset="0.7" stop-color="#D4A640"/><stop offset="1" stop-color="#A57A26"/></linearGradient>
  <filter id="ml-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="3" seed="7" stitchTiles="stitch" result="n"/>

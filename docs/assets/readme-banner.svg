     <text x="64" y="318" font-family="Segoe UI" font-size="17.5" fill="#6B6A66">An AI agent pays only inside mandates its owner signed. The vault</text>
     <text x="64" y="344" font-family="Segoe UI" font-size="17.5" fill="#6B6A66">contract checks every payment; a signed ledger records every decision.</text>

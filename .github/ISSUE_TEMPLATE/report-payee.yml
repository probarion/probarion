name: Report a payee
description: Propose a payee for the seed blocklist that `probarion payee check` reads, with public evidence.
labels: ["payee-report"]
body:
  - type: markdown
    attributes:
      value: |
        The blocklist is a seed list in `packages/core/src/payee-blocklist.json`, not a reputation service. Today it holds two testnet names from Probarion's own demo texts, and neither has a report of wrongdoing.
        An entry goes in by a pull request that edits that file, with the same evidence you give here. A report without public evidence is not added.
        **Do not paste a private key, a seed phrase or an API key.** Do not name a private person: report an address, not who you think holds it.
  - type: dropdown
    id: network
    attributes:
      label: Network
      options:
        - mainnet
        - testnet
    validations:
      required: true
  - type: input
    id: payee
    attributes:
      label: Payee
      description: "As `payee check` takes it: `near:<account>`, `base:<0x address>` or `solana:<address>`."
      placeholder: "near:example.near"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: One or two plain sentences on what the address did. They become the entry's reason.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence
      description: Links anyone can check, such as transaction hashes on an explorer or a published incident report.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: The evidence is public, and this report names an address, not a person.
          required: true

name: ci

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ts:
    name: TS lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No TS packages exist until plan 03; this runs Biome and the repo script tests.
      - run: pnpm run verify:ts

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 detect --source /repo --redact --verbose

  rust-unit:
    name: Rust fmt, clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --workspace --exclude integration-tests --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml --workspace --exclude integration-tests

  sandbox:
    name: Sandbox integration tests
    needs: rust-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - run: bash scripts/build-contracts.sh
      - run: cargo clippy --manifest-path contracts/Cargo.toml -p integration-tests --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml -p integration-tests -- --test-threads=2

  reproducible:
    name: Reproducible build and code hash
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # Full history: cargo-near clones this checkout with libgit2, and the job may need an older commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install cargo-near 0.22.0
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      # A reproducible wasm embeds the commit it was built from (NEP-330 source_code_snapshot), so a
      # recorded hash is reproduced only by rebuilding the recorded commit. If the current source is
      # recorded, rebuild that commit and compare; otherwise build this commit and upload it, and
      # record that artifact (scripts/code-hash.mjs record).
      - name: Choose the commit to build
        id: pick
        run: |
          recorded="$(node scripts/code-hash.mjs recorded-commit probarion-vault vault)"
          if [ -n "$recorded" ]; then
            echo "probarion-vault is recorded at $recorded: rebuilding that commit"
            git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/recorded"
            git -C "$RUNNER_TEMP/recorded" checkout --quiet --detach "$recorded" \
              || { echo "::error::recorded commit $recorded is not in the history of this checkout"; exit 1; }
            echo "src=$RUNNER_TEMP/recorded" >> "$GITHUB_OUTPUT"
          else
            echo "probarion-vault is not recorded for this source: building HEAD"
            echo "src=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi
      - name: Build the vault in Docker
        env:
          SRC_DIR: ${{ steps.pick.outputs.src }}
        run: bash scripts/build-reproducible.sh vault probarion_vault
      - name: Summary
        env:
          OUT: ${{ steps.pick.outputs.src }}/contracts/target/reproducible/vault
        run: |
          {
            echo "### probarion-vault reproducible build"
            echo '```json'
            cat "$OUT/probarion_vault.build-info.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded before the comparison, so a failing comparison still leaves the wasm to inspect.
      - uses: actions/upload-artifact@v4
        with:
          name: probarion-vault-wasm
          path: |
            ${{ steps.pick.outputs.src }}/contracts/target/reproducible/vault/probarion_vault.wasm
            ${{ steps.pick.outputs.src }}/contracts/target/reproducible/vault/probarion_vault.build-info.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare with contracts/code-hashes.json
        env:
          OUT: ${{ steps.pick.outputs.src }}/contracts/target/reproducible/vault
          REQUIRE_RECORDED: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: node scripts/code-hash.mjs check probarion-vault vault "$OUT/probarion_vault.wasm"

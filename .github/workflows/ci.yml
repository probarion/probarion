name: ci

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # sha256 of cargo-near-x86_64-unknown-linux-gnu.tar.gz in the GitHub release cargo-near-v0.22.0
  # (the release's own .sha256 file, sha256.sum and dist-manifest.json, and the asset digest in the
  # GitHub API, all agree). To change the version, change the URL in both install steps and this.
  CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a

# Third-party actions are pinned by full commit SHA, with the tag in a trailing comment, because a
# tag can be moved. Resolve a SHA with: gh api repos/<owner>/<repo>/commits/<tag-or-branch> -q .sha

jobs:
  ts:
    name: TS lint, typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # No TS packages exist until plan 03; this runs Biome and the repo script tests.
      - run: pnpm run verify:ts
      - run: pnpm verify:launch

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 detect --source /repo --redact --verbose

  rust-unit:
    name: Rust fmt, clippy and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts
      - run: cargo fmt --manifest-path contracts/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path contracts/Cargo.toml --workspace --exclude integration-tests --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml --workspace --exclude integration-tests

  sandbox:
    name: Sandbox integration tests
    needs: rust-unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts
      - name: Install cargo-near 0.22.0 (sha256-checked release archive)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-near.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "$CARGO_NEAR_SHA256  $archive" | sha256sum --check --strict -
          mkdir -p "$HOME/.cargo/bin" "$RUNNER_TEMP/cargo-near"
          tar -xzf "$archive" --no-same-owner --strip-components 1 -C "$RUNNER_TEMP/cargo-near"
          install -m 0755 "$RUNNER_TEMP/cargo-near/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      - run: bash scripts/build-contracts.sh
      - run: cargo clippy --manifest-path contracts/Cargo.toml -p integration-tests --all-targets -- -D warnings
      - run: cargo test --manifest-path contracts/Cargo.toml -p integration-tests -- --test-threads=2

  reproducible:
    name: Reproducible build and code hash (${{ matrix.dir }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # One leg per crate: each crate is picked, built, uploaded and compared on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: probarion-vault, dir: vault, lib: probarion_vault }
          - { crate: probarion-factory, dir: factory, lib: probarion_factory }
    steps:
      # Full history: cargo-near clones this checkout with libgit2, and the job may need an older commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install cargo-near 0.22.0 (sha256-checked release archive)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-near.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$archive" "https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "$CARGO_NEAR_SHA256  $archive" | sha256sum --check --strict -
          mkdir -p "$HOME/.cargo/bin" "$RUNNER_TEMP/cargo-near"
          tar -xzf "$archive" --no-same-owner --strip-components 1 -C "$RUNNER_TEMP/cargo-near"
          install -m 0755 "$RUNNER_TEMP/cargo-near/cargo-near" "$HOME/.cargo/bin/cargo-near"
          cargo near --version
      # A reproducible wasm embeds the commit it was built from (NEP-330 source_code_snapshot), so a
      # recorded hash is reproduced only by rebuilding the recorded commit. If the crate's current
      # source is recorded, rebuild that commit and compare; otherwise build this commit and upload
      # it, and record that artifact (scripts/code-hash.mjs record).
      - name: Choose the commit to build
        id: pick
        run: |
          recorded="$(node scripts/code-hash.mjs recorded-commit ${{ matrix.crate }} ${{ matrix.dir }})"
          if [ -n "$recorded" ]; then
            echo "${{ matrix.crate }} is recorded at $recorded: rebuilding that commit"
            git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/recorded"
            git -C "$RUNNER_TEMP/recorded" checkout --quiet --detach "$recorded" \
              || { echo "::error::recorded commit $recorded is not in the history of this checkout"; exit 1; }
            echo "src=$RUNNER_TEMP/recorded" >> "$GITHUB_OUTPUT"
          else
            echo "${{ matrix.crate }} is not recorded for this source: building HEAD"
            echo "src=$GITHUB_WORKSPACE" >> "$GITHUB_OUTPUT"
          fi
      - name: Build ${{ matrix.crate }} in Docker
        env:
          SRC_DIR: ${{ steps.pick.outputs.src }}
        run: bash scripts/build-reproducible.sh ${{ matrix.dir }} ${{ matrix.lib }}
      - name: Summary
        env:
          OUT: ${{ steps.pick.outputs.src }}/contracts/target/reproducible/${{ matrix.dir }}
        run: |
          {
            echo "### ${{ matrix.crate }} reproducible build"
            echo '```json'
            cat "$OUT/${{ matrix.lib }}.build-info.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Uploaded before the comparison, so a failing comparison still leaves the wasm to inspect.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.crate }}-wasm
          path: |
            ${{ steps.pick.outputs.src }}/contracts/target/reproducible/${{ matrix.dir }}/${{ matrix.lib }}.wasm
            ${{ steps.pick.outputs.src }}/contracts/target/reproducible/${{ matrix.dir }}/${{ matrix.lib }}.build-info.json
          if-no-files-found: error
          retention-days: 90
      - name: Compare with contracts/code-hashes.json
        env:
          OUT: ${{ steps.pick.outputs.src }}/contracts/target/reproducible/${{ matrix.dir }}
          REQUIRE_RECORDED: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
        run: node scripts/code-hash.mjs check ${{ matrix.crate }} ${{ matrix.dir }} "$OUT/${{ matrix.lib }}.wasm"

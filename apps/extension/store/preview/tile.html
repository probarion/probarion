<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>tile</title>
    <style>
      body {
        display: flex;
        gap: 22px;
        align-items: center;
        box-sizing: border-box;
        width: 440px;
        height: 280px;
        margin: 0;
        padding: 0 36px;
        background: #0b0b0c;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      .plate {
        display: grid;
        flex: none;
        place-items: center;
        width: 120px;
        height: 120px;
        border-radius: 26px;
        background: #f7f6f3;
      }
      h1 {
        margin: 0 0 8px;
        color: #f7f6f3;
        font-size: 30px;
      }
      p {
        margin: 0;
        color: #a9a59b;
        font-size: 16px;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <span class="plate"><img src="../../static/icons/128.png" alt="" width="88" height="88" /></span>
    <div>
      <h1>Probarion</h1>
      <p>Queue invoices from the browser. Pay only when you sign.</p>
    </div>
  </body>
</html>

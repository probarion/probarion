<svg role="img" aria-label="Probarion" xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400"><title>Probarion</title><defs>
  <linearGradient id="favl-sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5E4210"/><stop offset="0.28" stop-color="#B8892E"/><stop offset="0.42" stop-color="#E2BD5E"/><stop offset="0.56" stop-color="#C99A35"/><stop offset="0.8" stop-color="#A57A26"/><stop offset="1" stop-color="#5E4210"/></linearGradient>
  <radialGradient id="favl-hi" cx="24%" cy="20%" r="45%"><stop offset="0" stop-color="#FFF0C2" stop-opacity="0.4"/><stop offset="1" stop-color="#FFF0C2" stop-opacity="0"/></radialGradient>
  <radialGradient id="favl-warm" cx="86%" cy="82%" r="45%"><stop offset="0" stop-color="#EFCB6B" stop-opacity="0.55"/><stop offset="1" stop-color="#EFCB6B" stop-opacity="0"/></radialGradient>
